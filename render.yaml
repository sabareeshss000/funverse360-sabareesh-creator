services:
  - type: web
    name: funverse360-sabareesh-creator
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && cd frontend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false